[project]
name = "minidio"
version = "0.1.0"
description = ""
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-environ>=0.12.0",
    "google-cloud-speech>=2.32.0",
    "google-genai>=1.12.1",
    "markdown>=3.8",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
]
types = [
    "django-stubs>=5.2.0",
]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main"
]

strict = true
disallow_untyped_calls = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

exclude = [
    "migrations/*",
    "settings.py",
    "manage.py",
]

[tool.django-stubs]
django_settings_module = "minidio.settings"
strict_settings = true
